<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pickleball Hub - Tiendesitas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 900: '#14532d' }
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased pb-32">

    <!-- Header -->
    <header class="bg-white px-5 pt-12 pb-4 shadow-sm sticky top-0 z-40">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight">PickleHub</h1>
                <p class="text-sm font-medium text-slate-500">Tiendesitas, Pasig City</p>
            </div>
            <div class="w-10 h-10 bg-brand-50 text-brand-600 rounded-full flex items-center justify-center text-lg shadow-inner">
                <i class="fa-solid fa-table-tennis-paddle-ball"></i>
            </div>
        </div>

        <!-- Date Selector -->
        <div class="relative">
            <input type="date" id="date-selector" class="w-full bg-slate-100 text-slate-900 font-bold py-3 px-4 rounded-xl border-none focus:ring-2 focus:ring-brand-500 appearance-none text-center shadow-inner" onchange="fetchSchedule()">
            <i class="fa-regular fa-calendar absolute left-4 top-3.5 text-slate-400 text-lg pointer-events-none"></i>
        </div>
    </header>

    <!-- Main Content -->
    <main class="px-5 mt-6">
        <!-- AM / PM Filters -->
        <div class="flex gap-2 mb-6 bg-slate-200/70 p-1 rounded-xl relative">
            <button onclick="setFilter('all')" id="btn-filter-all" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition-all bg-white text-slate-900 shadow-sm">All Day</button>
            <button onclick="setFilter('AM')" id="btn-filter-AM" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition-all text-slate-500 hover:text-slate-900">Morning</button>
            <button onclick="setFilter('PM')" id="btn-filter-PM" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition-all text-slate-500 hover:text-slate-900">Evening</button>
            
            <!-- Hidden button to easily test the fully booked view during development -->
            <button onclick="simulateFullyBooked()" class="absolute right-0 -top-8 text-[10px] text-slate-400 underline">Sold Out Preview</button>
        </div>

        <!-- Schedule Container -->
        <div id="schedule-container" class="space-y-6">
            <!-- Loading State gets injected here -->
        </div>
    </main>

    <!-- Floating Action Button (Checkout) -->
    <div id="fab-container" class="fixed bottom-6 left-5 right-5 z-40 hidden transition-all duration-300 transform translate-y-4 opacity-0">
        <button onclick="openCheckout()" class="w-full bg-slate-900 text-white rounded-2xl p-4 shadow-xl flex justify-between items-center active:scale-95 transition-transform">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold" id="fab-count">0</div>
                <div class="text-left">
                    <div class="text-xs text-slate-300 font-medium">Total Amount</div>
                    <div class="text-lg font-black" id="fab-total">₱0</div>
                </div>
            </div>
            <div class="font-bold text-sm tracking-wide uppercase flex items-center gap-2">
                Book Now <i class="fa-solid fa-arrow-right"></i>
            </div>
        </button>
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeCheckout()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl p-6 max-h-[90vh] overflow-y-auto transform transition-transform duration-300 translate-y-full" id="checkout-drawer">
            
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-slate-900">Confirm Booking</h2>
                <button onclick="closeCheckout()" class="w-8 h-8 bg-slate-100 rounded-full text-slate-600 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="bg-slate-50 rounded-2xl p-4 mb-6 border border-slate-100">
                <p class="text-xs text-slate-500 font-medium mb-2 uppercase tracking-wider" id="checkout-date-display">Date</p>
                <div id="checkout-summary-list" class="space-y-2 mb-4"></div>
                <div class="border-t border-slate-200 pt-3 flex justify-between items-center">
                    <span class="font-bold text-slate-600">Total</span>
                    <span class="text-xl font-black text-brand-600" id="checkout-grand-total">₱0</span>
                </div>
            </div>

            <div class="space-y-4 mb-8">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5 ml-1">Email Address (For Confirmation)</label>
                    <input type="email" id="customer-email" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500" placeholder="juan@example.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5 ml-1">GCash Reference No. (13 Digits)</label>
                    <input type="number" id="gcash-ref" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500" placeholder="1234567890123">
                </div>
            </div>

            <button id="confirm-btn" onclick="submitBooking()" class="w-full bg-brand-500 text-white font-black text-base py-4 rounded-xl shadow-lg shadow-brand-500/30 active:scale-95 transition-all">
                Confirm & Pay
            </button>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // ==========================================
        // CONFIGURATION & STATE
        // ==========================================
        const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE'; 
        
        let masterSlots = [];
        let selectedSlots = [];
        let activeFilter = 'all';
        let forceFullyBooked = false;

        // Set default date to today
        document.addEventListener("DOMContentLoaded", () => {
            const dateInput = document.getElementById('date-selector');
            const phTime = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Manila"}));
            const yyyy = phTime.getFullYear();
            const mm = String(phTime.getMonth() + 1).padStart(2, '0');
            const dd = String(phTime.getDate()).padStart(2, '0');
            dateInput.value = `${yyyy}-${mm}-${dd}`;
            dateInput.min = `${yyyy}-${mm}-${dd}`;
            fetchSchedule();
        });

        // ==========================================
        // FETCH & RENDER LOGIC
        // ==========================================
        async function fetchSchedule() {
            forceFullyBooked = false; // Reset preview override
            const dateVal = document.getElementById('date-selector').value;
            const container = document.getElementById('schedule-container');
            
            // Render the custom SVG Paddle Loading Animation (No attached ball)
            container.innerHTML = `
                <div class="flex justify-center items-center h-48">
                    <div class="text-center">
                        <div class="relative w-16 h-16 mx-auto mb-4">
                            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3.5 h-3.5 bg-brand-500 rounded-full animate-bounce"></div>
                            <svg class="absolute bottom-0 w-12 h-12 text-slate-800 left-1/2 -translate-x-1/2" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19.7,4.3c-2.3-2.3-6.1-2.3-8.5,0l-6.9,6.9c-0.8,0.8-0.8,2.1,0,2.8l1.4,1.4l-3.5,3.5c-0.4,0.4-0.4,1,0,1.4l1.4,1.4c0.4,0.4,1,0.4,1.4,0l3.5-3.5l1.4,1.4c0.8,0.8,2.1,0.8,2.8,0l6.9-6.9C22,9.1,22,5.3,19.7,4.3z"/>
                            </svg>
                        </div>
                        <p class="text-slate-500 font-medium text-sm animate-pulse">Getting your courts ready for dinking!</p>
                    </div>
                </div>
            `;
            
            selectedSlots = [];
            updateFAB();

            try {
                if (SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') throw new Error("URL NOT SET");
                
                const response = await fetch(`${SCRIPT_URL}?date=${dateVal}`);
                masterSlots = await response.json();
                
                if(!masterSlots || masterSlots.length === 0) throw new Error("Empty Data");
                
            } catch (error) {
                console.log("Using Mock Data as fallback.");
                generateMockData();
            }

            renderSchedule();
        }

        function generateMockData() {
            masterSlots = [];
            const courts = ['Court 1', 'Court 2', 'Court 3'];
            for(let hour = 8; hour <= 22; hour++) {
                let timeString = (hour > 12 ? (hour - 12) : hour) + ':00 ' + (hour >= 12 ? 'PM' : 'AM') + ' - ' + 
                                 ((hour + 1) > 12 ? (hour + 1 - 12) : (hour + 1)) + ':00 ' + ((hour + 1) >= 12 ? 'PM' : 'AM');
                
                courts.forEach(court => {
                    let price = (hour >= 17) ? 400 : 300;
                    masterSlots.push({
                        "TimeSlot": timeString,
                        "CourtName": court,
                        "Price": price,
                        "Status": Math.random() > 0.4 ? "Available" : "Booked" 
                    });
                });
            }
        }

        function setFilter(filterType) {
            activeFilter = filterType;
            ['all', 'AM', 'PM'].forEach(f => {
                const btn = document.getElementById('btn-filter-' + f);
                if (f === filterType) {
                    btn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg transition-all bg-white text-slate-900 shadow-sm";
                } else {
                    btn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg transition-all text-slate-500 hover:text-slate-900";
                }
            });
            renderSchedule();
        }

        function parseTimeGroup(timeString) {
            const startStr = timeString.split('-')[0].trim();
            let [time, modifier] = startStr.split(' ');
            let [hours, minutes] = time.split(':');
            let hr = parseInt(hours, 10);
            if (modifier === 'PM' && hr !== 12) hr += 12;
            if (modifier === 'AM' && hr === 12) hr = 0;
            return { hour: hr, period: hr < 12 ? 'AM' : 'PM' };
        }

        function simulateFullyBooked() {
            forceFullyBooked = true;
            renderSchedule();
        }

        function renderSchedule() {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '';

            const dateVal = document.getElementById('date-selector').value;
            const phTime = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Manila"}));
            const yyyy = phTime.getFullYear();
            const mm = String(phTime.getMonth() + 1).padStart(2, '0');
            const dd = String(phTime.getDate()).padStart(2, '0');
            const todayStr = `${yyyy}-${mm}-${dd}`;
            
            const isToday = (dateVal === todayStr);
            const currentHour = phTime.getHours();

            let grouped = {};
            masterSlots.forEach(slot => {
                if (!grouped[slot.TimeSlot]) grouped[slot.TimeSlot] = [];
                grouped[slot.TimeSlot].push(slot);
            });

            let sortedTimes = Object.keys(grouped).map(time => {
                return { time: time, startHour: parseTimeGroup(time).hour, period: parseTimeGroup(time).period };
            }).sort((a, b) => a.startHour - b.startHour);

            let visibleSlotsCount = 0;

            if (!forceFullyBooked) {
                sortedTimes.forEach(slotGroup => {
                    if (activeFilter !== 'all' && slotGroup.period !== activeFilter) return;
                    if (isToday && slotGroup.startHour <= currentHour) return;

                    visibleSlotsCount++;
                    const isPeakHour = slotGroup.startHour >= 17 && slotGroup.startHour <= 21;
                    
                    const selectedInBlock = selectedSlots.filter(s => s.timeSlot === slotGroup.time);
                    const blockTotal = selectedInBlock.reduce((sum, s) => sum + s.price, 0);

                    let html = `
                    <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm mb-4">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                            <div class="flex items-center gap-2">
                                <span class="text-base font-black text-slate-900 tracking-tight">${slotGroup.time}</span>
                                ${isPeakHour ? `<span class="bg-amber-50 text-amber-700 px-2 py-0.5 rounded-md text-[10px] font-extrabold border border-amber-200/60 flex items-center gap-1"><i class="fa-solid fa-fire text-[9px]"></i> Peak</span>` : ''}
                            </div>
                            ${blockTotal > 0 ? `<span class="bg-brand-50 text-brand-700 px-2.5 py-1 rounded-lg text-[11px] font-bold">₱${blockTotal}</span>` : ''}
                        </div>
                        <div class="flex flex-wrap gap-2.5">
                    `;

                    grouped[slotGroup.time].forEach(court => {
                        const isSelected = selectedSlots.some(s => s.timeSlot === court.TimeSlot && s.courtName === court.CourtName);
                        
                        if (court.Status === "Available") {
                            if (isSelected) {
                                html += `<button onclick="toggleSlot('${court.TimeSlot}', '${court.CourtName}', ${court.Price})" class="flex-1 min-w-[30%] py-2.5 bg-brand-500 border-2 border-brand-500 text-white rounded-xl text-xs font-bold transform scale-105 transition-all shadow-md">✓ ${court.CourtName}</button>`;
                            } else {
                                html += `<button onclick="toggleSlot('${court.TimeSlot}', '${court.CourtName}', ${court.Price})" class="flex-1 min-w-[30%] py-2.5 bg-white border-2 border-slate-200 text-slate-700 rounded-xl text-xs font-bold hover:border-brand-300 hover:bg-brand-50 transition-colors">${court.CourtName}</button>`;
                            }
                        } else {
                            html += `<div class="flex-1 min-w-[30%] py-2.5 bg-slate-100 border-2 border-transparent text-slate-400 rounded-xl text-xs font-semibold text-center opacity-70">Booked</div>`;
                        }
                    });

                    html += `</div></div>`;
                    container.innerHTML += html;
                });
            }

            // WAITLIST CARD UI
            if (visibleSlotsCount === 0 || forceFullyBooked) {
                container.innerHTML = `
                    <div class="p-6 text-center bg-white rounded-3xl border border-slate-200 shadow-sm mt-4">
                        <div class="w-12 h-12 mx-auto rounded-full bg-slate-100 flex items-center justify-center text-xl mb-3">
                            😞
                        </div>
                        <div>
                            <h4 class="font-bold text-slate-900 text-sm">Sorry! All courts booked</h4>
                        </div>
                        <div class="space-y-3 mt-5 text-left">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 mb-1 ml-1 uppercase tracking-wider">Name</label>
                                <input type="text" id="waitlist-name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500" placeholder="Juan Dela Cruz">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 mb-1 ml-1 uppercase tracking-wider">Mobile Number</label>
                                <input type="tel" id="waitlist-mobile" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500" placeholder="0917 123 4567">
                            </div>
                        </div>
                        <button id="waitlist-submit-btn" onclick="submitWaitlist()" class="w-full py-3.5 bg-slate-900 hover:bg-slate-950 text-white font-extrabold rounded-xl text-xs uppercase tracking-wider transition cursor-pointer mt-5">
                            Join Waitlist
                        </button>
                        <p class="text-[10px] text-slate-400 mt-4 leading-tight">Your information is kept secure and is only used to send you updates for a pasalo court.</p>
                    </div>
                `;
            }
        }

        // ==========================================
        // WAITLIST SUBMISSION LOGIC
        // ==========================================
        async function submitWaitlist() {
            const nameInput = document.getElementById('waitlist-name');
            const mobileInput = document.getElementById('waitlist-mobile');
            const btn = document.getElementById('waitlist-submit-btn');
            
            const name = nameInput.value.trim();
            const mobile = mobileInput.value.trim();
            const dateVal = document.getElementById('date-selector').value;
            
            if (!name || !mobile) {
                alert("Please enter both your name and mobile number.");
                return;
            }
            
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Submitting...`;
            btn.disabled = true;
            
            const payload = {
                action: "waitlist",
                name: name,
                mobileNumber: mobile,
                date: dateVal
            };
            
            try {
                if (SCRIPT_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                } else {
                    await new Promise(r => setTimeout(r, 1000));
                }
                
                const container = document.getElementById('schedule-container');
                container.innerHTML = `
                <div class="p-8 text-center bg-white rounded-3xl border border-brand-200 shadow-sm mt-4">
                    <div class="w-16 h-16 mx-auto rounded-full bg-brand-100 text-brand-600 flex items-center justify-center text-3xl mb-4">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-900 text-lg">You're on the list!</h4>
                        <p class="text-sm text-slate-500 mt-2 leading-relaxed">We securely saved your info and will notify you at <strong class="text-slate-700">${mobile}</strong> if a court becomes available for this date.</p>
                    </div>
                </div>
                `;
                
            } catch (error) {
                alert("There was an error joining the waitlist. Please try again.");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // ==========================================
        // BOOKING & CHECKOUT LOGIC
        // ==========================================
        function toggleSlot(timeSlot, courtName, price) {
            const index = selectedSlots.findIndex(s => s.timeSlot === timeSlot && s.courtName === courtName);
            if (index > -1) {
                selectedSlots.splice(index, 1);
            } else {
                selectedSlots.push({ timeSlot, courtName, price });
            }
            updateFAB();
            renderSchedule(); 
        }

        function updateFAB() {
            const fab = document.getElementById('fab-container');
            if (selectedSlots.length > 0) {
                fab.classList.remove('hidden');
                setTimeout(() => { fab.classList.remove('translate-y-4', 'opacity-0'); }, 10);
                
                document.getElementById('fab-count').innerText = selectedSlots.length;
                const total = selectedSlots.reduce((sum, slot) => sum + slot.price, 0);
                document.getElementById('fab-total').innerText = '₱' + total;
            } else {
                fab.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => { fab.classList.add('hidden'); }, 300);
            }
        }

        function openCheckout() {
            const modal = document.getElementById('checkout-modal');
            const drawer = document.getElementById('checkout-drawer');
            const summaryList = document.getElementById('checkout-summary-list');
            
            const dateStr = document.getElementById('date-selector').value;
            const d = new Date(dateStr);
            document.getElementById('checkout-date-display').innerText = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

            summaryList.innerHTML = '';
            let total = 0;
            
            selectedSlots.forEach(slot => {
                total += slot.price;
                summaryList.innerHTML += `
                    <div class="flex justify-between items-center text-sm">
                        <div>
                            <div class="font-bold text-slate-900">${slot.courtName}</div>
                            <div class="text-xs text-slate-500">${slot.timeSlot}</div>
                        </div>
                        <div class="font-bold text-slate-600">₱${slot.price}</div>
                    </div>
                `;
            });
            
            document.getElementById('checkout-grand-total').innerText = '₱' + total;

            modal.classList.remove('hidden');
            setTimeout(() => { drawer.classList.remove('translate-y-full'); }, 10);
        }

        function closeCheckout() {
            const modal = document.getElementById('checkout-modal');
            const drawer = document.getElementById('checkout-drawer');
            drawer.classList.add('translate-y-full');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        async function submitBooking() {
            const email = document.getElementById('customer-email').value;
            const gcash = document.getElementById('gcash-ref').value;
            const btn = document.getElementById('confirm-btn');

            if (!email || !email.includes('@')) return alert("Please enter a valid email address.");
            if (gcash.length !== 13) return alert("Please enter a valid 13-digit GCash Reference Number.");

            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;
            btn.disabled = true;

            const payload = {
                action: "book",
                date: document.getElementById('date-selector').value,
                email: email,
                gcashRef: gcash,
                slots: selectedSlots
            };

            try {
                if (SCRIPT_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                } else {
                    await new Promise(r => setTimeout(r, 1500));
                }

                document.getElementById('checkout-drawer').innerHTML = `
                    <div class="text-center py-8">
                        <div class="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6">
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <h2 class="text-2xl font-black text-slate-900 mb-2">Booking Confirmed!</h2>
                        <p class="text-slate-500 mb-6">Your reservation details have been sent to <strong>${email}</strong>.</p>
                        <button onclick="window.location.reload()" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-xl">Back to Schedule</button>
                    </div>
                `;
            } catch (error) {
                alert("Failed to submit. Please try again.");
                btn.innerHTML = "Confirm & Pay";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
